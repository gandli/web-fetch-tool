services:
  db:
    image: postgres:17-alpine
    container_name: web-fetch-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: web_fetch
    ports:
      - "5433:5432"
    volumes:
      - ./.data/pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d web_fetch"]
      interval: 3s
      timeout: 3s
      retries: 20
